name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cse416_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cse416_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cse416_test?schema=public
      JWT_SECRET: test-secret-that-is-at-least-32-characters
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: npx prisma migrate status
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:api:ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build Koyeb API image
        run: docker build -f Dockerfile.koyeb -t cse416-api:koyeb .
      - name: Verify Koyeb image startup and API protection
        run: |
          docker run -d --name koyeb-api-smoke --network host \
            -e DATABASE_URL -e JWT_SECRET \
            -e NODE_ENV=production -e PORT=3001 \
            -e CORS_ORIGIN=http://localhost:5173 \
            cse416-api:koyeb
          trap 'docker logs koyeb-api-smoke; docker rm -f koyeb-api-smoke' EXIT
          curl --fail --retry 20 --retry-connrefused --retry-delay 2 http://127.0.0.1:3001/api/health
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3001/api/groups)
          test "$status" = "401"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
